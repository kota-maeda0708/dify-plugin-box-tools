identity:
  name: list_files
  author: kota-maeda0708
  label:
    en_US: List Files
    ja_JP: ファイル一覧
    zh_Hans: 列出文件
    pt_BR: Listar Arquivos
description:
  human:
    en_US: List files and folders inside a Box folder.
    ja_JP: Box フォルダ内のファイルとフォルダを一覧表示します。
    zh_Hans: 列出 Box 文件夹中的文件和文件夹。
    pt_BR: Lista os arquivos e pastas dentro de uma pasta do Box.
  llm: >-
    Lists the files and folders contained in a Box folder. If no folder_id is given, lists the
    contents of the root folder (id "0"). Returns each item's id, name, type, size and timestamps,
    which can be used as input to other Box tools (download, delete, move, etc.).
parameters:
  - name: folder_id
    type: string
    required: false
    default: "0"
    label:
      en_US: Folder ID
      ja_JP: フォルダ ID
      zh_Hans: 文件夹 ID
      pt_BR: ID da Pasta
    human_description:
      en_US: The Box folder ID to list. Leave empty or "0" for the root folder.
      ja_JP: 一覧表示する Box フォルダの ID。空欄または "0" でルートフォルダになります。
      zh_Hans: 要列出内容的 Box 文件夹 ID。留空或填 "0" 表示根文件夹。
      pt_BR: O ID da pasta do Box a ser listada. Deixe em branco ou use "0" para a pasta raiz.
    llm_description: >-
      The numeric Box folder ID whose contents should be listed. Use "0" for the root folder.
      Obtain other folder IDs from a previous list_files or search_files call.
    form: llm
  - name: limit
    type: number
    required: false
    default: 100
    label:
      en_US: Limit
      ja_JP: 件数上限
      zh_Hans: 数量上限
      pt_BR: Limite
    human_description:
      en_US: Maximum number of items to return (default 100, at most 1000; larger values are capped).
      ja_JP: 取得する件数の上限(デフォルト100件、最大1000件。超えた値は1000件として扱います)。
      zh_Hans: 返回结果的最大数量(默认 100，最多 1000；超过的值按 1000 处理)。
      pt_BR: Número máximo de itens a retornar (padrão 100, no máximo 1000; valores maiores são limitados).
    llm_description: Maximum number of items to return in one call, a whole number from 1 to 1000. Defaults to 100.
    form: llm
extra:
  python:
    source: tools/list_files.py
output_schema:
  type: object
  properties:
    items:
      type: array
      description: Files and folders in the folder
      items:
        type: object
        properties:
          id:
            type: string
            description: Box item ID
          name:
            type: string
            description: File or folder name
          type:
            type: string
            description: '"file", "folder" or "web_link"'
          size:
            type: integer
            description: Size in bytes
          created_at:
            type: string
            description: Created time (ISO 8601)
          modified_at:
            type: string
            description: Last modified time (ISO 8601)
    file_ids:
      type: array
      description: IDs of the files only (folders excluded), ready to pass to Download File
      items:
        type: string
    folder_ids:
      type: array
      description: IDs of the folders only (files excluded), ready to pass to List Files
      items:
        type: string
    count:
      type: integer
      description: Number of items returned (files, folders and web links)
    file_count:
      type: integer
      description: Number of files returned
    folder_count:
      type: integer
      description: Number of folders returned
    has_more:
      type: boolean
      description: True when Box reports more items than were returned (the result is partial)
    success:
      type: boolean
      description: True when the tool finished; false when it stopped with an error
    error:
      type: string
      description: Why the tool stopped, empty on success
